name: Compilar AutoEncuesta 360 v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar aplicación corregida
        env:
          APP_FILES: '{"settings.gradle.kts":"","build.gradle.kts":"cGx1Z2lucyB7IGlkKCJjb20uYW5kcm9pZC5hcHBsaWNhdGlvbiIpIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZSB9Cg==","app/build.gradle.kts":"","app/src/main/AndroidManifest.xml":"","app/src/main/java/com/autoencuesta/app/MainActivity.java":""}'
        run: |
          python3 - <<'PY'
          import os, json, base64, pathlib
          for filename, content in json.loads(os.environ["APP_FILES"]).items():
              path = pathlib.Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(content))
          PY
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Guardar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: AutoEncuesta360-v2-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
